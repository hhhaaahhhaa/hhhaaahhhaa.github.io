intro_zh: |
  黃維坪目前是國立臺灣大學電信工程學研究所博士候選人，於 Speech Processing and Machine Learning Lab 進行研究，指導教授為李宏毅教授。研究主題為 **test-time adaptation**、**self-supervised learning**、**speech synthesis** 與 **large audio language models**。

  他近期於 Meta Superintelligence Lab 擔任研究科學家實習生，研究高效率的 speech LLMs。攻讀博士之前，他取得國立臺灣大學數學系學士學位。

