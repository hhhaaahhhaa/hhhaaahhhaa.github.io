intro: |
  Wei-Ping Huang is a Ph.D. candidate in Communication Engineering at National Taiwan University (NTU),
  working in the Speech Processing and Machine Learning Lab advised by Prof. Hung-yi Lee.
  His research focuses on **test-time adaptation**, **self-supervised learning**, **speech synthesis**,
  and **large audio language models**.

  He recently worked as a Research Scientist Intern at Meta Superintelligence Lab on efficient speech LLMs.
  Before his Ph.D., he received a B.S. in Mathematics from NTU.

