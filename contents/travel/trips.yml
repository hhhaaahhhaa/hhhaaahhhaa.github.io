# One entry per trip, in any order. Shown as a dot on the map and a card in the list.
# Cards are grouped by year (taken from the first 4 characters of `date`), newest year
# first, and sorted oldest-to-newest inside each year - so keep dates as "YYYY/MM".
#   place:  name shown on the card / dot
#   place_zh: 繁體中文 name (optional; falls back to place)
#   date:   "YYYY/MM"
#   latlng: [latitude, longitude] - rough is fine. For a multi-city trip, give a list:
#           [[lat, lng], [lat, lng]] (one card, one dot per city)
#   cover:  optional photo, e.g. "/contents/travel/kyoto-2025/cover.jpg"
#   note:   optional one-liner (Markdown)
#   post:   optional link to a blog post with the full story, e.g. "/blog/2025/09/kyoto/"

